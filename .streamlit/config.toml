[theme]
primaryColor = "#1a7f37"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f8fa"
textColor = "#1f2328"
borderColor = "#d0d7de"
baseRadius = "8px"
font = "sans-serif"
chartCategoricalColors = ["#1a7f37", "#0969da", "#bf8700", "#8250df", "#cf222e", "#57606a"]
