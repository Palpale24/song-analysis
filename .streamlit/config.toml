chartDivergingColors = ["#67001f", "#b2182b", "#d6604d", "#f4a582", "#fddbc7", "#d1e5f0", "#92c5de", "#4393c3", "#2166ac", "#053061"]

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
